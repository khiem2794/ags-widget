/* ---------- Tokens ---------- */
:root {
  --paper: #edebe1;
  --paper-2: #e4e1d3;
  --card: #fffef9;
  --ink: #23261f;
  --muted: #6b6656;
  --line: #d6d1c0;
  --line-soft: #e0dccb;
  --accent: #3c6e52;
  --accent-ink: #f3f7f3;
  --accent-2: #a8622a;
  --danger: #a3402f;
  --danger-ink: #fbf2ef;
  --shadow: 0 1px 2px rgba(35,38,31,0.06), 0 6px 16px -8px rgba(35,38,31,0.18);
  --tab-pine: #3c6e52;
  --tab-ochre: #a8622a;
  --tab-plum: #7a4a6b;
  --tab-slate: #3f5f73;
  --tab-rust: #a3402f;
  --tab-moss: #6a7a3a;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #1a1c17;
    --paper-2: #212319;
    --card: #24261f;
    --ink: #ece8db;
    --muted: #a29c88;
    --line: #3a3c31;
    --line-soft: #313327;
    --accent: #82bb9c;
    --accent-ink: #16241b;
    --accent-2: #dba169;
    --danger: #e08a76;
    --danger-ink: #2a1813;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 10px 24px -10px rgba(0,0,0,0.55);
    --tab-pine: #6fa98d;
    --tab-ochre: #cf9256;
    --tab-plum: #ad84a3;
    --tab-slate: #7fa3ba;
    --tab-rust: #d38874;
    --tab-moss: #a3b46e;
  }
}
:root[data-theme="dark"] {
  --paper: #1a1c17;
  --paper-2: #212319;
  --card: #24261f;
  --ink: #ece8db;
  --muted: #a29c88;
  --line: #3a3c31;
  --line-soft: #313327;
  --accent: #82bb9c;
  --accent-ink: #16241b;
  --accent-2: #dba169;
  --danger: #e08a76;
  --danger-ink: #2a1813;
  --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 10px 24px -10px rgba(0,0,0,0.55);
  --tab-pine: #6fa98d;
  --tab-ochre: #cf9256;
  --tab-plum: #ad84a3;
  --tab-slate: #7fa3ba;
  --tab-rust: #d38874;
  --tab-moss: #a3b46e;
}

/* ---------- Base ---------- */
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: 'Work Sans', system-ui, sans-serif;
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3 { font-family: 'Fraunces', Georgia, serif; font-weight: 700; margin: 0; text-wrap: balance; }
::selection { background: var(--accent); color: var(--accent-ink); }
a { color: inherit; }
button { font-family: inherit; }

.mono {
  font-family: 'IBM Plex Mono', ui-monospace, monospace;
  font-weight: 500;
  letter-spacing: 0.04em;
}

/* ---------- Shell ---------- */
.shell {
  max-width: 1180px;
  margin: 0 auto;
  padding: 2.5rem 1.75rem 5rem;
}

.masthead {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 1.5rem;
  padding-bottom: 1.5rem;
  border-bottom: 2px solid var(--ink);
  margin-bottom: 2rem;
  flex-wrap: wrap;
}
.masthead-title {
  font-size: clamp(1.75rem, 3vw, 2.35rem);
  font-style: italic;
  font-weight: 600;
  display: flex;
  align-items: baseline;
  gap: 0.6rem;
}
.masthead-title .index-no {
  font-family: 'IBM Plex Mono', monospace;
  font-style: normal;
  font-weight: 500;
  font-size: 0.55em;
  color: var(--muted);
  letter-spacing: 0.02em;
}
.masthead-meta {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 0.72rem;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.08em;
}

/* ---------- Toolbar ---------- */
.toolbar {
  display: flex;
  gap: 0.75rem;
  align-items: center;
  margin-bottom: 1.5rem;
  flex-wrap: wrap;
}
.search-field {
  position: relative;
  flex: 1 1 240px;
  min-width: 180px;
}
.search-field input {
  width: 100%;
  padding: 0.65rem 0.9rem 0.65rem 2.2rem;
  border-radius: 3px;
  border: 1px solid var(--line);
  background: var(--card);
  color: var(--ink);
  font: inherit;
  font-size: 0.9rem;
}
.search-field input:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 1px;
}
.search-field svg {
  position: absolute;
  left: 0.7rem;
  top: 50%;
  transform: translateY(-50%);
  width: 15px;
  height: 15px;
  stroke: var(--muted);
  pointer-events: none;
}
.new-btn {
  background: var(--ink);
  color: var(--paper);
  border: 1px solid var(--ink);
  border-radius: 3px;
  padding: 0.65rem 1.15rem;
  font-size: 0.85rem;
  font-weight: 600;
  letter-spacing: 0.02em;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 0.45rem;
  white-space: nowrap;
  transition: transform 0.12s ease, background 0.15s ease;
}
.new-btn:hover { background: var(--accent); border-color: var(--accent); }
.new-btn:active { transform: translateY(1px); }
.new-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---------- Category rail (chips) ---------- */
.rail {
  display: flex;
  flex-wrap: wrap;
  gap: 0.5rem;
  margin-bottom: 2rem;
}
.chip {
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
  padding: 0.38rem 0.75rem 0.38rem 0.6rem;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: var(--card);
  color: var(--muted);
  font-family: 'IBM Plex Mono', monospace;
  font-size: 0.72rem;
  font-weight: 500;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  cursor: pointer;
  transition: border-color 0.15s ease, color 0.15s ease, background 0.15s ease;
}
.chip .dot { width: 7px; height: 7px; border-radius: 50%; flex: none; background: var(--dot, var(--muted)); }
.chip:hover { border-color: var(--dot, var(--line)); color: var(--ink); }
.chip[aria-pressed="true"] {
  background: var(--dot, var(--ink));
  border-color: var(--dot, var(--ink));
  color: var(--accent-ink);
}
.chip[aria-pressed="true"] .dot { background: var(--accent-ink); }
.chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.chip .count { opacity: 0.75; font-weight: 500; }

/* ---------- Grid ---------- */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 1.1rem;
  align-items: start;
}

.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 4px;
  box-shadow: var(--shadow);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  cursor: pointer;
  transition: transform 0.16s ease, box-shadow 0.16s ease, border-color 0.16s ease;
  position: relative;
}
.card:hover, .card:focus-visible {
  transform: translateY(-3px) rotate(-0.35deg);
  border-color: var(--dot, var(--line));
}
.card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.card-tab {
  height: 6px;
  background: var(--dot, var(--muted));
  flex: none;
}
.card-body {
  padding: 1.1rem 1.15rem 1rem;
  display: flex;
  flex-direction: column;
  gap: 0.55rem;
  flex: 1;
}
.card-cat {
  display: inline-flex;
  align-items: center;
  gap: 0.35rem;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 0.68rem;
  font-weight: 600;
  letter-spacing: 0.07em;
  text-transform: uppercase;
  color: var(--dot, var(--muted));
  align-self: flex-start;
}
.card-title {
  font-size: 1.15rem;
  line-height: 1.3;
  font-weight: 700;
}
.card-content {
  color: var(--muted);
  font-size: 0.88rem;
  line-height: 1.55;
  display: -webkit-box;
  -webkit-line-clamp: 4;
  -webkit-box-orient: vertical;
  overflow: hidden;
  flex: 1;
}
.card-content:empty::before { content: "No content."; font-style: italic; opacity: 0.7; }
.card-foot {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 0.3rem;
  padding-top: 0.6rem;
  border-top: 1px dashed var(--line-soft);
  font-family: 'IBM Plex Mono', monospace;
  font-size: 0.68rem;
  color: var(--muted);
  letter-spacing: 0.03em;
}
.card-actions { display: flex; gap: 0.15rem; opacity: 0; transition: opacity 0.12s ease; }
.card:hover .card-actions, .card:focus-within .card-actions { opacity: 1; }
.icon-btn {
  border: none;
  background: transparent;
  color: var(--muted);
  width: 26px;
  height: 26px;
  border-radius: 3px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}
.icon-btn:hover { background: var(--paper-2); color: var(--ink); }
.icon-btn.danger:hover { background: var(--danger-ink); color: var(--danger); }
.icon-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.icon-btn svg { width: 14px; height: 14px; }

/* ---------- Empty state ---------- */
.empty {
  border: 1px dashed var(--line);
  border-radius: 6px;
  padding: 4rem 2rem;
  text-align: center;
  color: var(--muted);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.9rem;
}
.empty svg { width: 40px; height: 40px; stroke: var(--muted); opacity: 0.7; }
.empty h2 { font-size: 1.3rem; font-style: italic; color: var(--ink); }
.empty p { max-width: 32ch; margin: 0; font-size: 0.9rem; }

/* ---------- Modal ---------- */
.overlay {
  position: fixed;
  inset: 0;
  background: rgba(20, 21, 16, 0.42);
  backdrop-filter: blur(1.5px);
  display: flex;
  align-items: flex-start;
  justify-content: center;
  padding: 5vh 1.25rem;
  z-index: 20;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.15s ease;
}
.overlay.open { opacity: 1; pointer-events: auto; }
.modal {
  background: var(--card);
  border-radius: 6px;
  width: 100%;
  max-width: 540px;
  box-shadow: 0 24px 60px -20px rgba(0,0,0,0.45);
  border: 1px solid var(--line);
  transform: translateY(10px) scale(0.98);
  transition: transform 0.18s ease;
  max-height: 88vh;
  display: flex;
  flex-direction: column;
}
.overlay.open .modal { transform: translateY(0) scale(1); }
@media (prefers-reduced-motion: reduce) {
  .overlay, .modal, .card, .new-btn { transition: none !important; }
}
.modal-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 1.1rem 1.25rem;
  border-bottom: 1px solid var(--line-soft);
  flex: none;
}
.modal-head h2 { font-size: 1.25rem; font-style: italic; }
.modal-close {
  border: none;
  background: transparent;
  color: var(--muted);
  cursor: pointer;
  width: 30px;
  height: 30px;
  border-radius: 4px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}
.modal-close:hover { background: var(--paper-2); color: var(--ink); }
.modal-close:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.modal-close svg { width: 16px; height: 16px; }

.modal-form { padding: 1.25rem; display: flex; flex-direction: column; gap: 1.1rem; overflow-y: auto; }
.field { display: flex; flex-direction: column; gap: 0.4rem; }
.field label {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 0.68rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.07em;
  color: var(--muted);
}
.field input, .field textarea, .field select {
  font: inherit;
  padding: 0.65rem 0.75rem;
  border-radius: 3px;
  border: 1px solid var(--line);
  background: var(--paper);
  color: var(--ink);
  resize: vertical;
}
.field textarea { min-height: 140px; line-height: 1.55; }
.field input:focus-visible, .field textarea:focus-visible, .field select:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 1px;
}
.title-input { font-family: 'Fraunces', serif; font-size: 1.2rem; font-weight: 700; }
.field-error { color: var(--danger); font-size: 0.78rem; display: none; }
.field.invalid input, .field.invalid textarea { border-color: var(--danger); }
.field.invalid .field-error { display: block; }

.cat-row { display: flex; gap: 0.6rem; }
.cat-row select { flex: 1; }
.cat-row input { flex: 1; }
.swatch-picker { display: flex; gap: 0.4rem; align-items: center; }
.swatch {
  width: 20px; height: 20px; border-radius: 50%;
  border: 2px solid transparent;
  cursor: pointer;
  padding: 0;
}
.swatch[aria-pressed="true"] { border-color: var(--ink); }
.swatch:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.modal-foot {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 1rem 1.25rem;
  border-top: 1px solid var(--line-soft);
  flex: none;
  gap: 0.75rem;
}
.timestamp-note {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 0.68rem;
  color: var(--muted);
}
.btn-row { display: flex; gap: 0.6rem; }
.btn {
  padding: 0.6rem 1.1rem;
  border-radius: 3px;
  font-size: 0.85rem;
  font-weight: 600;
  cursor: pointer;
  border: 1px solid var(--line);
  background: var(--card);
  color: var(--ink);
}
.btn:hover { border-color: var(--muted); }
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn-primary { background: var(--ink); border-color: var(--ink); color: var(--paper); }
.btn-primary:hover { background: var(--accent); border-color: var(--accent); }

/* ---------- Confirm dialog ---------- */
.confirm-box { max-width: 380px; }
.confirm-body { padding: 1.25rem; display: flex; flex-direction: column; gap: 0.5rem; }
.confirm-body p { margin: 0; color: var(--muted); font-size: 0.88rem; }
.btn-danger { background: var(--danger); border-color: var(--danger); color: var(--danger-ink); }
.btn-danger:hover { filter: brightness(1.08); }

/* ---------- Toast ---------- */
.toast {
  position: fixed;
  bottom: 1.5rem;
  left: 50%;
  transform: translateX(-50%) translateY(8px);
  background: var(--ink);
  color: var(--paper);
  padding: 0.65rem 1.1rem;
  border-radius: 4px;
  font-size: 0.82rem;
  font-family: 'IBM Plex Mono', monospace;
  letter-spacing: 0.02em;
  box-shadow: 0 10px 30px -10px rgba(0,0,0,0.5);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s ease, transform 0.2s ease;
  z-index: 30;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
}

@media (max-width: 640px) {
  .shell { padding: 1.5rem 1.1rem 4rem; }
  .card-foot { flex-wrap: wrap; gap: 0.4rem; }
}
</style>

<div class="shell">
  <header class="masthead">
    <h1 class="masthead-title">Notecard <span class="index-no" id="entry-count">— 0 entries</span></h1>
    <div class="masthead-meta" id="today-stamp"></div>

  <div class="toolbar">
    <div class="search-field">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" id="search-input" placeholder="Search titles and content…" aria-label="Search notes">
    </div>
    <button class="new-btn" id="new-note-btn" type="button">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      New note
    </button>
  </div>

  <div class="rail" id="category-rail" role="group" aria-label="Filter by category"></div>

  <div class="grid" id="notes-grid"></div>

  <div class="empty" id="empty-state" hidden>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 3h8a2 2 0 0 1 2 2v14l-6-3-6 3V5a2 2 0 0 1 2-2z"/></svg>
    <h2 id="empty-title">The catalog is empty</h2>
    <p id="empty-desc">Start a note to capture something worth keeping — an idea, a task, a quote.</p>

</div>

<div class="overlay" id="note-overlay">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" id="note-modal">

      </div>

</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  "use strict";

  var STORAGE_KEY = "notecard.notes.v1";
  var PALETTE = [
    { name: "pine",  css: "var(--tab-pine)"  },
    { name: "ochre", css: "var(--tab-ochre)" },
    { name: "plum",  css: "var(--tab-plum)"  },
    { name: "slate", css: "var(--tab-slate)" },
    { name: "rust",  css: "var(--tab-rust)"  },
    { name: "moss",  css: "var(--tab-moss)"  }
  ];
  var DEFAULT_CATEGORIES = ["Ideas", "Tasks", "Reading", "Journal"];

  /** @type {{id:string,title:string,content:string,category:string,color:string,createdAt:number,updatedAt:number}[]} */
  var notes = [];
  var activeFilter = "all";
  var searchTerm = "";
  var editingId = null;
  var pendingDeleteId = null;
  var lastFocused = null;

  var els = {
    grid: document.getElementById("notes-grid"),
    empty: document.getElementById("empty-state"),
    emptyTitle: document.getElementById("empty-title"),
    emptyDesc: document.getElementById("empty-desc"),
    rail: document.getElementById("category-rail"),
    count: document.getElementById("entry-count"),
    stamp: document.getElementById("today-stamp"),
    search: document.getElementById("search-input"),
    newBtn: document.getElementById("new-note-btn"),
    overlay: document.getElementById("note-overlay"),
    modal: document.getElementById("note-modal"),
    modalTitle: document.getElementById("modal-title"),
    modalTimestamp: document.getElementById("modal-timestamp"),
    form: document.getElementById("note-form"),
    titleField: document.getElementById("title-field"),
    titleInput: document.getElementById("title-input"),
    categorySelect: document.getElementById("category-select"),
    categoryInput: document.getElementById("category-input"),
    swatchPicker: document.getElementById("swatch-picker"),
    contentInput: document.getElementById("content-input"),
    closeBtn: document.getElementById("modal-close-btn"),
    cancelBtn: document.getElementById("cancel-btn"),
    confirmOverlay: document.getElementById("confirm-overlay"),
    confirmDesc: document.getElementById("confirm-desc"),
    confirmCloseBtn: document.getElementById("confirm-close-btn"),
    confirmCancelBtn: document.getElementById("confirm-cancel-btn"),
    confirmDeleteBtn: document.getElementById("confirm-delete-btn"),
    toast: document.getElementById("toast")
  };

  var selectedColor = PALETTE[0].name;
  var toastTimer = null;

  // ---------- persistence ----------
  function load() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      notes = raw ? JSON.parse(raw) : seedNotes();
    } catch (e) {
      notes = seedNotes();
    }
  }
  function persist() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(notes)); } catch (e) { /* storage unavailable */ }
  }
  function seedNotes() {
    var now = Date.now();
    return [
      {
        id: uid(), title: "Welcome to Notecard",
        content: "This is a note. Click any card to open, edit, or delete it. Use the field above to search, or the row of tabs to filter by category.",
        category: "Ideas", color: "pine", createdAt: now - 3000, updatedAt: now - 3000
      },
      {
        id: uid(), title: "Renew library card",
        content: "Expires end of the month — bring the old one plus something with the new address on it.",
        category: "Tasks", color: "ochre", createdAt: now - 2000, updatedAt: now - 2000
      },
      {
        id: uid(), title: "Quote worth keeping",
        content: "“The palest ink is better than the best memory.”",
        category: "Journal", color: "slate", createdAt: now - 1000, updatedAt: now - 1000
      }
    ];
  }
  function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }

  // ---------- derived data ----------
  function allCategories() {
    var set = {};
    DEFAULT_CATEGORIES.forEach(function (c) { set[c] = colorFor(c); });
    notes.forEach(function (n) { set[n.category] = n.color; });
    return Object.keys(set).map(function (name) { return { name: name, color: set[name] }; });
  }
  function colorFor(name) {
    var hash = 0;
    for (var i = 0; i < name.length; i++) hash = (hash * 31 + name.charCodeAt(i)) >>> 0;
    return PALETTE[hash % PALETTE.length].name;
  }
  function swatchCss(colorName) {
    var found = PALETTE.filter(function (p) { return p.name === colorName; })[0];
    return found ? found.css : PALETTE[0].css;
  }

  // ---------- rendering ----------
  function render() {
    renderRail();
    renderGrid();
    els.count.textContent = "— " + notes.length + " " + (notes.length === 1 ? "entry" : "entries");
  }

  function renderRail() {
    var cats = allCategories();
    var frag = document.createDocumentFragment();

    frag.appendChild(makeChip("all", "All", null, notes.length));
    cats.forEach(function (c) {
      var n = notes.filter(function (note) { return note.category === c.name; }).length;
      frag.appendChild(makeChip(c.name, c.name, c.color, n));
    });

    els.rail.innerHTML = "";
    els.rail.appendChild(frag);
  }

  function makeChip(value, label, colorName, count) {
    var btn = document.createElement("button");
    btn.type = "button";
    btn.className = "chip";
    btn.setAttribute("aria-pressed", String(activeFilter === value));
    if (colorName) btn.style.setProperty("--dot", swatchCss(colorName));
    var dot = document.createElement("span");
    dot.className = "dot";
    var text = document.createElement("span");
    text.textContent = label;
    var countEl = document.createElement("span");
    countEl.className = "count";
    countEl.textContent = count;
    btn.appendChild(dot);
    btn.appendChild(text);
    btn.appendChild(countEl);
    btn.addEventListener("click", function () {
      activeFilter = value;
      render();
    });
    return btn;
  }

  function filteredNotes() {
    var term = searchTerm.trim().toLowerCase();
    return notes
      .filter(function (n) { return activeFilter === "all" || n.category === activeFilter; })
      .filter(function (n) {
        if (!term) return true;
        return n.title.toLowerCase().indexOf(term) !== -1 || n.content.toLowerCase().indexOf(term) !== -1;
      })
      .sort(function (a, b) { return b.updatedAt - a.updatedAt; });
  }

  function renderGrid() {
    var list = filteredNotes();
    els.grid.innerHTML = "";

    if (notes.length === 0) {
      els.empty.hidden = false;
      els.emptyTitle.textContent = "The catalog is empty";
      els.emptyDesc.textContent = "Start a note to capture something worth keeping — an idea, a task, a quote.";
      els.grid.hidden = true;
      return;
    }
    if (list.length === 0) {
      els.empty.hidden = false;
      els.emptyTitle.textContent = "No matching notes";
      els.emptyDesc.textContent = "Try a different search term or clear the category filter.";
      els.grid.hidden = true;
      return;
    }
    els.empty.hidden = true;
    els.grid.hidden = false;

    var frag = document.createDocumentFragment();
    list.forEach(function (note) { frag.appendChild(renderCard(note)); });
    els.grid.appendChild(frag);
  }

  function renderCard(note) {
    var card = document.createElement("article");
    card.className = "card";
    card.tabIndex = 0;
    card.style.setProperty("--dot", swatchCss(note.color));
    card.setAttribute("role", "button");
    card.setAttribute("aria-label", "Open note: " + note.title);

    var tab = document.createElement("div");
    tab.className = "card-tab";

    var body = document.createElement("div");
    body.className = "card-body";

    var cat = document.createElement("span");
    cat.className = "card-cat mono";
    cat.textContent = note.category;

    var title = document.createElement("h3");
    title.className = "card-title";
    title.textContent = note.title;

    var content = document.createElement("p");
    content.className = "card-content";
    content.textContent = note.content;

    var foot = document.createElement("div");
    foot.className = "card-foot";
    var date = document.createElement("span");
    date.textContent = formatDate(note.updatedAt);
    var actions = document.createElement("span");
    actions.className = "card-actions";

    var editBtn = iconButton("Edit note", editIcon(), function (e) {
      e.stopPropagation();
      openEditor(note.id);
    });
    var delBtn = iconButton("Delete note", trashIcon(), function (e) {
      e.stopPropagation();
      openConfirm(note.id);
    });
    delBtn.classList.add("danger");
    actions.appendChild(editBtn);
    actions.appendChild(delBtn);

    foot.appendChild(date);
    foot.appendChild(actions);

    body.appendChild(cat);
    body.appendChild(title);
    body.appendChild(content);
    body.appendChild(foot);

    card.appendChild(tab);
    card.appendChild(body);

    card.addEventListener("click", function () { openEditor(note.id); });
    card.addEventListener("keydown", function (e) {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openEditor(note.id); }
    });

    return card;
  }

  function iconButton(label, svg, onClick) {
    var btn = document.createElement("button");
    btn.type = "button";
    btn.className = "icon-btn";
    btn.setAttribute("aria-label", label);
    btn.title = label;
    btn.innerHTML = svg;
    btn.addEventListener("click", onClick);
    return btn;
  }
  function editIcon() {
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>';
  }
  function trashIcon() {
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>';
  }

  function formatDate(ts) {
    var d = new Date(ts);
    var months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
    return months[d.getMonth()] + " " + d.getDate() + ", " + d.getFullYear();
  }

  // ---------- modal: editor ----------
  function populateCategorySelect() {
    var cats = allCategories();
    els.categorySelect.innerHTML = "";
    var blank = document.createElement("option");
    blank.value = "";
    blank.textContent = cats.length ? "Choose…" : "No categories yet";
    els.categorySelect.appendChild(blank);
    cats.forEach(function (c) {
      var opt = document.createElement("option");
      opt.value = c.name;
      opt.textContent = c.name;
      els.categorySelect.appendChild(opt);
    });
  }

  function renderSwatchPicker() {
    els.swatchPicker.innerHTML = "";
    PALETTE.forEach(function (p) {
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "swatch";
      btn.style.background = p.css;
      btn.setAttribute("aria-label", p.name + " color");
      btn.setAttribute("aria-pressed", String(selectedColor === p.name));
      btn.addEventListener("click", function () {
        selectedColor = p.name;
        renderSwatchPicker();
      });
      els.swatchPicker.appendChild(btn);
    });
  }

  function openEditor(id) {
    lastFocused = document.activeElement;
    editingId = id || null;
    var note = id ? notes.filter(function (n) { return n.id === id; })[0] : null;

    els.form.reset();
    els.titleField.classList.remove("invalid");
    populateCategorySelect();

    if (note) {
      els.modalTitle.textContent = "Edit note";
      els.titleInput.value = note.title;
      els.categorySelect.value = note.category;
      els.categoryInput.value = "";
      els.contentInput.value = note.content;
      selectedColor = note.color;
      els.modalTimestamp.textContent = "Created " + formatDate(note.createdAt) + (note.updatedAt !== note.createdAt ? " · edited " + formatDate(note.updatedAt) : "");
    } else {
      els.modalTitle.textContent = "New note";
      els.titleInput.value = "";
      els.categorySelect.value = "";
      els.categoryInput.value = "";
      els.contentInput.value = "";
      selectedColor = PALETTE[0].name;
      els.modalTimestamp.textContent = "";
    }
    renderSwatchPicker();
    openOverlay(els.overlay);
    window.setTimeout(function () { els.titleInput.focus(); }, 10);
  }

  function closeEditor() {
    closeOverlay(els.overlay);
    editingId = null;
    restoreFocus();
  }

  els.categorySelect.addEventListener("change", function () {
    if (els.categorySelect.value) {
      els.categoryInput.value = "";
      selectedColor = colorFor(els.categorySelect.value);
      renderSwatchPicker();
    }
  });
  els.categoryInput.addEventListener("input", function () {
    if (els.categoryInput.value.trim()) {
      els.categorySelect.value = "";
    }
  });

  els.form.addEventListener("submit", function (e) {
    e.preventDefault();
    var title = els.titleInput.value.trim();
    if (!title) {
      els.titleField.classList.add("invalid");
      els.titleInput.focus();
      return;
    }
    els.titleField.classList.remove("invalid");

    var category = (els.categoryInput.value.trim() || els.categorySelect.value || "Uncategorized");
    var content = els.contentInput.value.trim();
    var now = Date.now();

    if (editingId) {
      var note = notes.filter(function (n) { return n.id === editingId; })[0];
      if (note) {
        note.title = title;
        note.category = category;
        note.content = content;
        note.color = selectedColor;
        note.updatedAt = now;
      }
      showToast("Note updated");
    } else {
      notes.push({
        id: uid(), title: title, category: category, content: content,
        color: selectedColor, createdAt: now, updatedAt: now
      });
      showToast("Note added");
    }
    persist();
    closeEditor();
    render();
  });

  els.closeBtn.addEventListener("click", closeEditor);
  els.cancelBtn.addEventListener("click", closeEditor);
  els.overlay.addEventListener("click", function (e) { if (e.target === els.overlay) closeEditor(); });

  // ---------- modal: confirm delete ----------
  function openConfirm(id) {
    lastFocused = document.activeElement;
    pendingDeleteId = id;
    var note = notes.filter(function (n) { return n.id === id; })[0];
    els.confirmDesc.textContent = note
      ? "“" + note.title + "” will be permanently deleted. This can't be undone."
      : "This can't be undone.";
    openOverlay(els.confirmOverlay);
    window.setTimeout(function () { els.confirmDeleteBtn.focus(); }, 10);
  }
  function closeConfirm() {
    closeOverlay(els.confirmOverlay);
    pendingDeleteId = null;
    restoreFocus();
  }
  els.confirmDeleteBtn.addEventListener("click", function () {
    if (pendingDeleteId) {
      notes = notes.filter(function (n) { return n.id !== pendingDeleteId; });
      persist();
      showToast("Note deleted");
    }
    closeConfirm();
    render();
  });
  els.confirmCancelBtn.addEventListener("click", closeConfirm);
  els.confirmCloseBtn.addEventListener("click", closeConfirm);
  els.confirmOverlay.addEventListener("click", function (e) { if (e.target === els.confirmOverlay) closeConfirm(); });

  // ---------- overlay helpers ----------
  function openOverlay(overlay) {
    overlay.classList.add("open");
    document.addEventListener("keydown", onEscape);
  }
  function closeOverlay(overlay) {
    overlay.classList.remove("open");
    if (!els.overlay.classList.contains("open") && !els.confirmOverlay.classList.contains("open")) {
      document.removeEventListener("keydown", onEscape);
    }
  }
  function onEscape(e) {
    if (e.key !== "Escape") return;
    if (els.confirmOverlay.classList.contains("open")) closeConfirm();
    else if (els.overlay.classList.contains("open")) closeEditor();
  }
  function restoreFocus() {
    if (lastFocused && typeof lastFocused.focus === "function") lastFocused.focus();
  }

  // ---------- toast ----------
  function showToast(msg) {
    els.toast.textContent = msg;
    els.toast.classList.add("show");
    window.clearTimeout(toastTimer);
    toastTimer = window.setTimeout(function () { els.toast.classList.remove("show"); }, 2200);
  }

  // ---------- search ----------
  els.search.addEventListener("input", function () {
    searchTerm = els.search.value;
    renderGrid();
  });

  els.newBtn.addEventListener("click", function () { openEditor(null); });

  // ---------- init ----------
  function initStamp() {
    var d = new Date();
    var months = ["January","February","March","April","May","June","July","August","September","October","November","December"];
    els.stamp.textContent = months[d.getMonth()] + " " + d.getDate() + ", " + d.getFullYear();
  }

  load();
  initStamp();
  render();
})();
</script>
